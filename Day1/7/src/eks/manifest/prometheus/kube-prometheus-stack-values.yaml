grafana:
  defaultDashboardsEnabled: false
  adminUser: "skillsPLAYER_NUMBER"
  adminPassword: "HelloKrSkills!PLAYER_NUMBER@"
  nodeSelector:
    unicorn: addon
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "unicorn"
      watchMethod: WATCH
    datasources:
      enabled: true
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/"

prometheus:
  prometheusSpec:
    nodeSelector:
      unicorn: addon

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      unicorn: addon

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false
