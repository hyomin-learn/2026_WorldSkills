apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: o11y
  labels: { app: log-generator }
spec:
  replicas: 2
  selector:
    matchLabels: { app: log-generator }
  template:
    metadata:
      labels: { app: log-generator }
    spec:
      containers:
        - name: app
          image: __ECR_URL__:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: log-generator
  namespace: o11y
spec:
  type: ClusterIP
  selector: { app: log-generator }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: log-generator
  namespace: o11y
spec:
  serviceRef:
    name: log-generator
    port: 8080
  targetGroupARN: __APP_TG_ARN__
  targetType: ip
  networking:
    ingress:
      - from:
          - securityGroup:
              groupID: __ALB_SG_ID__
        ports:
          - protocol: TCP
            port: 8080
