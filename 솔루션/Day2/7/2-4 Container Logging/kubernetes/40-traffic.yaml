apiVersion: batch/v1
kind: Job
metadata:
  name: log-seed
  namespace: o11y
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: log-seed
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command:
            - /bin/sh
            - -c
            - |
              URL=http://log-generator.o11y.svc.cluster.local:8080/log
              curl -s -o /dev/null "$URL?level=info&count=30"
              curl -s -o /dev/null "$URL?level=warn&count=15"
              curl -s -o /dev/null "$URL?level=error&count=9"
              echo "seed done"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
